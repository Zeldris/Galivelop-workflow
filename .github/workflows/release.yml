name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    # The cheap refusals come first: a bad tag or CHANGELOG fails in seconds, before the slow check matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true  # the "on main" step runs git fetch, which needs the token on a private repo
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points to ${GITHUB_SHA:0:7}, which is not on main; merge it to main and tag again: git tag -f $GITHUB_REF_NAME origin/main" >&2
            exit 1
          fi
      - name: Tag, plugin.json and markers agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag but plugin.json says $version; fix it: python3 scripts/version.py $tag" >&2
            exit 1
          fi
          python3 scripts/version.py
      - name: Release notes from the CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Fixed-string match on the heading: the dots of a version are not regex wildcards.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for $version, or it is empty; write it and tag again" >&2
            exit 1
          fi
          if awk -v head="## [$version]" 'index($0, head) == 1 { print; exit }' CHANGELOG.md | grep -q 'Unreleased'; then
            echo "the CHANGELOG entry for $version still says Unreleased; set the date and tag again" >&2
            exit 1
          fi
          if grep -qF -e '(por completar)' -e '(to be filled in)' notes.md; then
            echo "the CHANGELOG entry for $version still has the placeholders of scripts/version.py; write the notes and tag again" >&2
            exit 1
          fi
  check:
    # D63: the same check as every push, run by the reusable workflow, once the tag is verified.
    needs: verify
    uses: ./.github/workflows/check.yml
  release:
    needs: [verify, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Fixed-string match on the heading: the dots of a version are not regex wildcards.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Galivelop-workflow $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
