name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # harvest.py needs the flow's full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck (shellcheckVersion of .claude/gw.json)
        # The runner's own shellcheck (apt, brew) can be another version, whose warnings differ from the session's.
        run: |
          version="$(python3 scripts/config.py get shellcheckVersion)"
          python3 -m pip install "shellcheck-py==$version.*"
          shellcheck --version
      - name: Check
        run: bash tests/check.sh
