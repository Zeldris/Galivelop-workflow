name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # harvest.py needs the flow's full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck (shellcheckVersion of .claude/gw.json)
        # The runner's own shellcheck (apt, brew) can be another version, whose warnings differ from the session's.
        run: |
          version="$(python3 scripts/config.py get shellcheckVersion)"
          python3 -m pip install "shellcheck-py==$version.*"
          shellcheck --version
      - name: Install actionlint (actionlintVersion of .claude/gw.json)
        # E71: `ci-local.py --validate` (tests/check.sh) lints the workflows with it unless `ciActionlint` is off. Only on
        # GitHub (ci-local.py runs this file on a machine expected to have its own tools), in a venv under RUNNER_TEMP
        # so the runner's system Python is not touched.
        run: |
          if [ "${GITHUB_ACTIONS:-}" = true ] && [ "$(python3 scripts/config.py get ciActionlint)" != off ] \
              && compgen -G '.github/workflows/*.y*ml' >/dev/null; then
            version="$(python3 scripts/config.py get actionlintVersion)"
            python3 -m venv "$RUNNER_TEMP/actionlint"
            "$RUNNER_TEMP/actionlint/bin/pip" install --quiet "actionlint-py${version:+==$version.*}"
            echo "$RUNNER_TEMP/actionlint/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"
      - name: Front (E5) on Linux - packages outside the tree, Chromium, then front.py run full
        # npm ci of templates/front into <git dir>/gw/front-node (the cache tests/test_front_sample.py reads, so the
        # sample runs instead of being skipped) and the Chromium that pinned Playwright asks for; --with-deps (apt,
        # sudo) only on GitHub. `run full` does nothing while .claude/gw.json has no front.tokens. macOS: the sample
        # stays skipped with its reason (E-9).
        if: runner.os == 'Linux'
        run: |
          deps=""
          if [ "${GITHUB_ACTIONS:-}" = true ]; then deps="--with-deps"; fi
          if [ "$(uname)" = Linux ] && command -v npm >/dev/null; then
            python3 scripts/front.py install --package-dir templates/front --browsers chromium $deps
            python3 scripts/front.py run full
          else
            echo "front: skipped (Linux with node and npm only)"
          fi
      - name: Check
        # B37: the macOS runner is slower; the tests' waits (tests/waits.py) grow by this factor there.
        env:
          GW_TEST_TIMEOUT_SCALE: ${{ runner.os == 'macOS' && '3' || '1' }}
        run: bash tests/check.sh
